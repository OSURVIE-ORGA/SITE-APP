    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f3e5f5;
      color: #3a3a3a;
      padding: 30px 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      color: #6a1b9a;
      text-align: center;
      margin-bottom: 20px;
    }
    .quiz-container {
      background: #fff;
      border-radius: 10px;
      padding: 20px 30px;
      box-shadow: 0 0 12px rgba(106, 27, 154, 0.25);
    }
    .question {
      font-weight: 700;
      margin-bottom: 15px;
      font-size: 1.15rem;
    }
    ul.answers {
      list-style: none;
      padding: 0;
      margin-bottom: 15px;
    }
    ul.answers li {
      margin-bottom: 12px;
    }
    label {
      cursor: pointer;
      user-select: none;
    }
    input[type="radio"] {
      margin-right: 10px;
      cursor: pointer;
    }
    button {
      background-color: #6a1b9a;
      color: #f3e5f5;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(106, 27, 154, 0.5);
      transition: background-color 0.3s ease;
    }
    button:disabled {
      background-color: #b39ddb;
      cursor: default;
      box-shadow: none;
    }
    button:hover:not(:disabled) {
      background-color: #4a148c;
    }
    .feedback {
      margin-top: 10px;
      padding: 12px 18px;
      border-radius: 6px;
      font-weight: 600;
    }
    .correct {
      background-color: #dcedc8;
      color: #33691e;
      border: 1px solid #558b2f;
    }
    .incorrect {
      background-color: #ffcdd2;
      color: #b71c1c;
      border: 1px solid #c62828;
    }
    .explanation {
      margin-top: 10px;
      font-style: italic;
      color: #6a1b9a;
    }
    .score {
      font-size: 1.3rem;
      font-weight: 700;
      color: #6a1b9a;
      text-align: center;
      margin-top: 25px;
    }
    .restart-btn {
      display: block;
      margin: 25px auto 0;
    }
